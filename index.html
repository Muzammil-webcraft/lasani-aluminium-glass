<form
  id="contactForm"
  action="https://formspree.io/f/xkjwybkk"
  method="POST">

  <div class="form-row">

    <label>
      Full Name

      <input
        type="text"
        name="name"
        id="name"
        required
        placeholder="Your name">
    </label>


    <label>
      Phone

      <input
        type="tel"
        name="phone"
        id="phone"
        required
        placeholder="+92...">
    </label>

  </div>


  <label>
    Email

    <input
      type="email"
      name="email"
      id="email"
      placeholder="you@example.com">
  </label>


  <label>
    Project Type

    <select
      name="project"
      id="project">

      <option>
        Aluminium Windows
      </option>

      <option>
        Aluminium Doors
      </option>

      <option>
        Glass Work
      </option>

      <option>
        SS Steel
      </option>

      <option>
        Custom Project
      </option>

    </select>

  </label>


  <label>
    Message

    <textarea
      name="message"
      id="message"
      rows="5"
      placeholder="Tell us about your project..."></textarea>

  </label>


  <button
    type="submit"
    class="btn primary">

    Send Enquiry

  </button>


  <p id="formMessage"></p>

</form>
